<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校草之墙 · 投票</title>
<style>
:root{--blue:#3b6fd6;--blue-d:#1a3f8f;--blue-l:#6f9bff;--blue-bg:#eaf1ff;--ink:#0a1a3a;--muted:#5a6a88;--teal:#18a8c7;--gold:#f4b740;--pink:#e0498f}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:radial-gradient(1100px 500px at 80% -10%,rgba(59,111,214,.16),transparent 60%),radial-gradient(900px 500px at -10% 20%,rgba(24,168,199,.16),transparent 60%),linear-gradient(160deg,#f0f5ff 0%,#eaf1ff 50%,#f4f9ff 100%)}
.wrap{position:relative;z-index:5;max-width:860px;margin:0 auto;padding:0 18px 60px}
.topnav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;flex-wrap:wrap;gap:10px}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:1px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.nav-a{text-decoration:none;padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;background:#fff;border:1.5px solid #cdd9f5;color:var(--muted);transition:.2s}
.nav-a:hover{border-color:var(--blue);color:var(--blue)}
.nav-a.on{background:var(--blue);color:#fff;border-color:var(--blue)}
header{text-align:center;padding:18px 0 20px}
header h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,var(--teal),var(--blue-d),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{color:var(--muted);margin-top:10px;font-size:.92rem;letter-spacing:4px}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 22px}
.stats span{background:#fff;border:1px solid #cdd9f5;border-radius:12px;padding:8px 16px;font-size:.85rem;box-shadow:0 8px 20px rgba(59,111,214,.08)}
.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 30px rgba(59,111,214,.10);margin-bottom:20px;border:1px solid #dfe8f7}
.panel h3{font-size:1rem;margin-bottom:12px;letter-spacing:1px}
.panel.small{padding:14px 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row input{flex:1;min-width:140px;padding:11px 14px;border-radius:12px;border:1px solid #cdd9f5;font-size:.95rem;background:#fbfcff;color:var(--ink);outline:none}
.row input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,111,214,.12)}
.btn{border:none;cursor:pointer;background:linear-gradient(90deg,var(--teal),var(--blue-d));color:#fff;padding:11px 18px;border-radius:12px;font-size:.92rem;font-weight:600;letter-spacing:1px;box-shadow:0 8px 18px rgba(59,111,214,.25);transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);box-shadow:none}
.note{font-size:.74rem;color:var(--muted);letter-spacing:.5px;margin-top:8px;line-height:1.5}
.note.center{text-align:center}
.code-tip{font-size:.85rem;color:#b07800;margin-top:6px;min-height:1.2em}
.code-tip.show{font-weight:700}
.sec-title{font-size:1.1rem;margin:22px 0 14px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,.05);border:1px solid rgba(59,111,214,.18);text-align:center;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(59,111,214,.15)}
.ph{position:relative;border-radius:12px;overflow:hidden;background:#e6ecf8;margin-bottom:10px}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.ph .medal{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.9);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.nm{font-weight:700;font-size:1rem;margin-bottom:4px}
.ms{font-size:.82rem;color:var(--muted);margin-bottom:10px;min-height:1em;line-height:1.4}
.vf{display:flex;justify-content:center;gap:10px;align-items:center}
.vote{border:none;cursor:pointer;background:linear-gradient(90deg,var(--teal),var(--blue-d));color:#fff;padding:8px 18px;border-radius:999px;font-weight:600;font-size:.88rem;transition:.15s}
.vote:hover{transform:translateY(-1px)}
.vote.dis{background:#ccc;cursor:not-allowed}
.ct{font-weight:700;color:var(--blue-d);font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:40px 0;letter-spacing:1px}
footer{text-align:center;color:var(--muted);font-size:.78rem;letter-spacing:2px;margin-top:28px}
@media(max-width:560px){.row{flex-direction:column}.row input{min-width:0}}

/* === 精致化（投票页 视觉统一 index/主墙） === */
:root{--card:#fff;--ink:#3a0a1a;--muted:#8a5a68;--radius:16px;--shadow:0 8px 24px rgba(196,0,42,.08)}
body.dark{--card:#2a1018;--ink:#f5dfe6;--muted:#c79ba8;--shadow:0 8px 24px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
@media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
.card{background:var(--card);border:1px solid rgba(196,0,42,.08);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;transition:transform .22s cubic-bezier(.2,.7,.3,1.2),box-shadow .22s}
.card:hover{transform:translateY(-6px) scale(1.012);box-shadow:0 18px 36px rgba(196,0,42,.16)}
body.dark .card{background:var(--card);border-color:rgba(255,255,255,.08)}
.card .ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:linear-gradient(160deg,#ffe6f2,#fff5f7)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .ph img{transform:scale(1.05)}
.card .medal{position:absolute;top:10px;left:10px;font-size:1.3rem;background:rgba(255,255,255,.9);
  border-radius:10px;padding:2px 8px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.card .nm{font-weight:800;font-size:1.02rem;color:var(--ink);padding:10px 12px 0}
.card .ms{font-size:.82rem;color:var(--muted);padding:4px 12px 0;line-height:1.4}
.card .vf{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.card .ct{font-size:.85rem;font-weight:700;color:var(--rose,#c4002a)}
body.dark .card .nm{color:#f5dfe6}
body.dark .card .ms{color:#c79ba8}
.card .vote{border:none;cursor:pointer;background:linear-gradient(90deg,#c4002a,#ff4d6d);color:#fff;
  font-weight:700;padding:8px 16px;border-radius:10px;transition:.18s;box-shadow:0 5px 14px rgba(196,0,42,.28)}
.card .vote:hover{transform:translateY(-1px)}
.card .vote.done,.card .vote.dis{background:#999;opacity:.6;pointer-events:none}
/* 深色切换钮 */
.dark-toggle{position:fixed;right:14px;top:14px;z-index:80;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(196,0,42,.25);background:var(--card);cursor:pointer;font-size:16px;box-shadow:0 4px 12px rgba(196,0,42,.15)}
/* 深色覆盖面板/输入 */
body.dark .panel,body.dark .wrap{color:var(--ink)}
body.dark .btn{background:linear-gradient(90deg,#c4002a,#ff4d6d)}
body.dark input{background:#1a0810;color:#f5dfe6;border-color:rgba(255,255,255,.15)}
/* 空态/加载 */
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:.95rem}
.empty.err a{color:#c4002a;cursor:pointer}
.loading-spin{display:block;width:36px;height:36px;margin:24px auto;border:4px solid #ffd6e3;border-top-color:#c4002a;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

</style>
<style>.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(196,0,42,.08);box-shadow:0 2px 14px rgba(196,0,42,.05)}.nav-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap}.brand{font-weight:800;font-size:1rem;letter-spacing:.5px;color:#c4002a;display:flex;align-items:center;gap:8px;margin-right:auto}.brand small{font-weight:400;color:#8a5a68;font-size:.72rem;letter-spacing:0}.nav a.nl{font-size:.82rem;font-weight:600;padding:8px 13px;border-radius:12px;color:#8a5a68;text-decoration:none;transition:.18s;background:transparent}.nav a.nl:hover{background:rgba(196,0,42,.07);color:#c4002a}.nav a.nl.cur{background:linear-gradient(135deg,#3b6fd6,#8fb4ff);color:#fff}</style>
