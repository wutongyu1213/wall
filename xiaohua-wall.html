<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>校花之墙 · 投票 · 校园墙</title>
<style>
:root{
  --bg1:#fff7fa;--bg2:#ffeef5;--accent:#e0498f;--accent2:#c4002a;
  --ink:#2b1220;--muted:#9a7184;--line:#ffdbe8;--line-soft:#fff0f6;
  --card:#ffffff;--surface:#fffafc;
  --shadow:0 10px 30px rgba(196,0,42,.07);--shadow-hover:0 18px 40px rgba(196,0,42,.14);
  --ease:cubic-bezier(.2,.7,.3,1.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(900px 420px at 85% -8%,rgba(224,73,143,.16),transparent 60%),
    radial-gradient(800px 460px at -10% 30%,rgba(255,124,176,.14),transparent 55%),
    linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,#fff5f0 100%);
  background-attachment:fixed}
/* ===== 玻璃导航 ===== */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,252,254,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(196,0,42,.08);box-shadow:0 2px 16px rgba(196,0,42,.05)}
.nav-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:.95rem;letter-spacing:.5px;color:var(--accent2);display:flex;align-items:center;gap:8px;margin-right:auto}
.brand small{font-weight:400;color:var(--muted);font-size:.7rem;letter-spacing:0}
.nav a.nl{font-size:.82rem;font-weight:600;padding:8px 14px;border-radius:12px;color:var(--muted);text-decoration:none;transition:.18s}
.nav a.nl:hover{background:rgba(224,73,143,.08);color:var(--accent2)}
.nav a.nl.cur{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(196,0,42,.25)}
/* ===== 容器 ===== */
.wrap{max-width:820px;margin:0 auto;padding:8px 16px 48px}
/* ===== hero ===== */
.hero{text-align:center;padding:34px 0 18px}
.hero h1{font-size:clamp(2rem,5.5vw,2.9rem);font-weight:800;letter-spacing:4px;
  background:linear-gradient(95deg,var(--accent) 10%,var(--accent2) 55%,#f4b740 110%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{color:var(--muted);margin-top:10px;font-size:.86rem;letter-spacing:3px}
/* ===== 统计 ===== */
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 22px}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:.82rem;
  box-shadow:var(--shadow);color:var(--muted);font-weight:600}
/* ===== 面板/上传 ===== */
.panel{background:var(--card);border:1px solid var(--line-soft);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:22px}
.panel h3{font-size:.98rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:4px;height:16px;border-radius:4px;background:linear-gradient(var(--accent),var(--accent2))}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row input{flex:1;min-width:150px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:.9rem;background:var(--surface);color:var(--ink);outline:none;transition:.18s}
.row input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(224,73,143,.12)}
.btn{border:none;cursor:pointer;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;padding:12px 22px;border-radius:12px;font-size:.9rem;font-weight:700;letter-spacing:1px;box-shadow:0 8px 18px rgba(196,0,42,.25);transition:.2s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(196,0,42,.32)}
.btn:disabled{opacity:.6;transform:none}
.note{font-size:.74rem;color:var(--muted);line-height:1.6;margin-top:10px}
.note.center{text-align:center}
/* ===== 标题 + 须知 ===== */
.sec-title{font-size:1.05rem;font-weight:800;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.notice-box{display:flex;gap:8px;align-items:flex-start;background:#fff8ef;border:1px solid #ffe9c8;border-radius:14px;padding:10px 13px;font-size:.8rem;color:#8a6a2a;line-height:1.6;margin-bottom:16px}
.nb-ico{flex:none}
/* ===== 卡片 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card:hover{transform:translateY(-6px) scale(1.012);box-shadow:var(--shadow-hover)}
.card .ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:linear-gradient(160deg,var(--line-soft),#fff)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;transition:transform .4s var(--ease)}
.card:hover .ph img{transform:scale(1.05)}
.card .medal{position:absolute;top:10px;left:10px;z-index:3;font-size:1.05rem;line-height:1;padding:5px 11px;border-radius:999px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(4px);box-shadow:0 4px 12px rgba(0,0,0,.15);font-weight:700}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .nm{font-size:1rem;font-weight:800;line-height:1.35}
.card .ms{font-size:.8rem;color:var(--muted);line-height:1.45}
.card .vf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.vf-btns{display:flex;gap:6px}
.card .vote{border:none;cursor:pointer;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;font-weight:700;
  padding:8px 16px;border-radius:10px;transition:.18s var(--ease);box-shadow:0 5px 14px rgba(196,0,42,.25);font-size:.84rem}
.card .vote:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(196,0,42,.32)}
.card .vote.done,.card .vote:disabled{background:#cfc3c8;box-shadow:none;pointer-events:none;opacity:.75}
.card .vote.appeal{background:transparent;color:var(--accent2);border:1.5px solid var(--line);box-shadow:none}
.card .vote.appeal:hover{background:rgba(224,73,143,.07)}
.card .ct{font-size:.82rem;font-weight:800;color:var(--accent2);white-space:nowrap}
/* ===== 占位头像 ===== */
.ph-ava{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ph-ava-ch{font-size:52px;font-weight:800;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.22)}
.ph-ava-sub{font-size:11px;color:rgba(255,255,255,.92);background:rgba(0,0,0,.2);padding:2px 10px;border-radius:999px;backdrop-filter:blur(2px)}
/* ===== 空态/加载 ===== */
.empty{text-align:center;padding:44px 16px;color:var(--muted);font-size:.95rem;letter-spacing:1px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
.empty.err a{color:var(--accent2);cursor:pointer;text-decoration:underline}
.loading-spin{display:block;width:34px;height:34px;margin:0 auto 12px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== 页脚 ===== */
footer{text-align:center;color:var(--muted);font-size:.75rem;letter-spacing:2px;padding:8px 16px 30px}
/* ===== 深色 ===== */
.dark-toggle{position:fixed;right:16px;top:70px;z-index:80;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;box-shadow:var(--shadow);transition:.18s var(--ease)}
.dark-toggle:hover{transform:translateY(-2px)}
body.dark{--bg1:#160a10;--bg2:#1f0d16;--ink:#f3dce6;--muted:#b98ba0;--line:rgba(255,143,163,.18);--line-soft:rgba(255,143,163,.1);--card:#241018;--surface:#1a0a12;--shadow:0 10px 30px rgba(0,0,0,.45);--shadow-hover:0 18px 40px rgba(0,0,0,.6)}
body.dark{background:radial-gradient(900px 420px at 85% -8%,rgba(224,73,143,.1),transparent 60%),radial-gradient(800px 460px at -10% 30%,rgba(255,124,176,.08),transparent 55%),linear-gradient(165deg,var(--bg1),var(--bg2))}
body.dark .nav{background:rgba(24,10,18,.85);border-bottom-color:rgba(255,143,163,.1)}
body.dark .brand{color:#ff8fa3}
body.dark .brand small{color:#b98ba0}
body.dark .notice-box{background:#241608;border-color:#4a3410;color:#d8b26a}
body.dark .card .vote.appeal{border-color:rgba(255,143,163,.25);color:#ff8fa3}
@media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.wrap{padding:4px 12px 40px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.card .ph{aspect-ratio:3/4}}
</style>
