<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校花之墙 · 投票</title>
<style>
:root{--pink:#e0498f;--pink-l:#ff7cb0;--pink-bg:#ffe6f2;--ink:#3a0a1a;--muted:#8a5a68;--blue:#3b6fd6;--gold:#f4b740}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:radial-gradient(1100px 500px at 80% -10%,rgba(224,73,143,.18),transparent 60%),radial-gradient(900px 500px at -10% 20%,rgba(255,124,176,.18),transparent 60%),linear-gradient(160deg,#fff5f7 0%,#ffe9ef 50%,#fff0f5 100%)}
.wrap{position:relative;z-index:5;max-width:860px;margin:0 auto;padding:0 18px 60px}
.topnav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;flex-wrap:wrap;gap:10px}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:1px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.nav-a{text-decoration:none;padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;background:#fff;border:1.5px solid #ffd7e0;color:var(--muted);transition:.2s}
.nav-a:hover{border-color:var(--pink);color:var(--pink)}
.nav-a.on{background:var(--pink);color:#fff;border-color:var(--pink)}
header{text-align:center;padding:18px 0 20px}
header h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,var(--pink),#c4002a,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{color:var(--muted);margin-top:10px;font-size:.92rem;letter-spacing:4px}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 22px}
.stats span{background:#fff;border:1px solid #ffd7e0;border-radius:12px;padding:8px 16px;font-size:.85rem;box-shadow:0 8px 20px rgba(224,73,143,.08)}
.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 30px rgba(224,73,143,.10);margin-bottom:20px;border:1px solid #ffe3ea}
.panel h3{font-size:1rem;margin-bottom:12px;letter-spacing:1px}
.panel.small{padding:14px 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row input{flex:1;min-width:140px;padding:11px 14px;border-radius:12px;border:1px solid #ffd7e0;font-size:.95rem;background:#fffafc;color:var(--ink);outline:none}
.row input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(224,73,143,.12)}
.btn{border:none;cursor:pointer;background:linear-gradient(90deg,var(--pink),#c4002a);color:#fff;padding:11px 18px;border-radius:12px;font-size:.92rem;font-weight:600;letter-spacing:1px;box-shadow:0 8px 18px rgba(224,73,143,.25);transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--pink);border:1.5px solid var(--pink);box-shadow:none}
.note{font-size:.74rem;color:var(--muted);letter-spacing:.5px;margin-top:8px;line-height:1.5}
.note.center{text-align:center}
.code-tip{font-size:.85rem;color:#b07800;margin-top:6px;min-height:1.2em}
.code-tip.show{font-weight:700}
.sec-title{font-size:1.1rem;margin:22px 0 14px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,.05);border:1px solid rgba(224,73,143,.18);text-align:center;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(224,73,143,.15)}
.ph{position:relative;border-radius:12px;overflow:hidden;background:#f6e8ee;margin-bottom:10px}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.ph .medal{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.9);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.nm{font-weight:700;font-size:1rem;margin-bottom:4px}
.ms{font-size:.82rem;color:var(--muted);margin-bottom:10px;min-height:1em;line-height:1.4}
.vf{display:flex;justify-content:center;gap:10px;align-items:center}
.vote{border:none;cursor:pointer;background:linear-gradient(90deg,var(--pink),#c4002a);color:#fff;padding:8px 18px;border-radius:999px;font-weight:600;font-size:.88rem;transition:.15s}
.vote:hover{transform:translateY(-1px)}
.vote.dis{background:#ccc;cursor:not-allowed}
.ct{font-weight:700;color:#c4002a;font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:40px 0;letter-spacing:1px}
footer{text-align:center;color:var(--muted);font-size:.78rem;letter-spacing:2px;margin-top:28px}
@media(max-width:560px){.row{flex-direction:column}.row input{min-width:0}}
</style>
</head>
