<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园表白 · 校花校草之墙</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(160deg,#fff5f7,#eaf1ff 55%,#f4f9ff);padding:20px}
.box{text-align:center;max-width:520px;width:100%}
h1{font-size:2rem;margin-bottom:8px;letter-spacing:2px;background:linear-gradient(90deg,#e0498f,#3b6fd6);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#667;margin-bottom:28px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{display:block;text-decoration:none;background:#fff;border-radius:18px;padding:26px 20px;box-shadow:0 12px 30px rgba(0,0,0,.07);transition:.2s;text-align:center}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.12)}
.card .ico{font-size:2.2rem;display:block;margin-bottom:10px}
.card .t{font-weight:800;font-size:1.2rem;letter-spacing:2px}
.card .d{font-size:.82rem;color:#8a9;margin-top:8px;letter-spacing:1px}
.card.pink{border-top:4px solid #e0498f}.card.pink .t{color:#e0498f}
.card.blue{border-top:4px solid #3b6fd6}.card.blue .t{color:#3b6fd6}
.card.rose{border-top:4px solid #ff4d6d}.card.rose .t{color:#ff4d6d}
</style>
</head>
<body>
<div class="box">
  <h1>校园墙</h1>
  <p>选择你要去的墙</p>
  <div class="grid">
    <a class="card rose" href="love-wall.html"><span class="ico">❤️</span><span class="t">表白墙</span><span class="d">把想说的话贴到墙上</span></a>
    <a class="card pink" href="xiaohua-wall.html"><span class="ico">🌸</span><span class="t">校花之墙</span><span class="d">同学传照片 · 投票排名</span></a>
    <a class="card blue" href="xiaocao-wall.html"><span class="ico">🌿</span><span class="t">校草之墙</span><span class="d">同学传照片 · 投票排名</span></a>
  </div>
</div>
</body>
</html>
